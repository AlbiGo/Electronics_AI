<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElectronicsAI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101614;
      --panel: #17211e;
      --line: #2c4038;
      --text: #e7efe9;
      --muted: #8aa396;
      --net: #7ec8c3;
      --silk: #e2b657;
      --probe: #7dcea0;
      --heat: #e08a4f;
      --fail: #e07a7a;
      --face: #24332e;
      --power: #e06a5c;
      --signal: #6fbf73;
      --control: #e2b657;
      --gnd: #9aa3a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 "Segoe UI", sans-serif;
    }

    header { padding: 14px 20px; }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    h1 { font-size: 18px; font-weight: 600; margin: 0; }

    .presets, .stats, .parts { display: flex; gap: 8px; flex-wrap: wrap; }

    .assumptions { margin: 0; padding-left: 18px; }
    .assumptions li { margin: 4px 0; }

    button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }

    button.active, button.primary {
      background: var(--net);
      color: #10211f;
      border-color: var(--net);
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto minmax(150px, 210px);
      height: 100vh;
      overflow: hidden;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      padding: 16px;
      background: #141c19;
      border-right: 1px solid var(--line);
    }

    .side form { flex-direction: column; align-items: stretch; }
    .side label, .history-label { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    #description { min-height: 112px; resize: vertical; }
    #history { display: grid; align-content: start; gap: 4px; overflow: auto; flex: 1; }
    .history-item { text-align: left; }
    .history-item.active { border-color: var(--probe); color: var(--probe); }

    #log { margin: 0; white-space: pre-wrap; }

    .viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .viewer-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 16px 0;
    }
    .viewer-bar h2 { font-size: 16px; }
    .viewer-bar p { margin: 2px 0 0; }
    .tools { display: flex; gap: 6px; flex-wrap: wrap; }

    #stage {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 16px;
      border: 1px solid #2c4038;
      border-radius: 12px;
      background-color: #141816;
      background-image:
        linear-gradient(#0c100e, #0c100e),
        radial-gradient(circle, #070908 1.45px, #3a4440 2.05px, transparent 2.55px);
      background-size: 100% 22px, 14px 14px;
      background-position: center, 8px 42px;
      background-repeat: no-repeat, repeat;
      box-shadow: inset 0 0 0 10px #1c2420;
    }

    #stage::before,
    #stage::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      height: 22px;
      pointer-events: none;
      z-index: 0;
    }

    #stage::before {
      top: 14px;
      background-image:
        linear-gradient(#e06a5c, #e06a5c),
        radial-gradient(circle, #070908 1.45px, #3a4440 2.05px, transparent 2.55px);
      background-size: 100% 3px, 14px 22px;
      background-position: 0 3px, 0 8px;
      background-repeat: no-repeat, repeat-x;
    }

    #stage::after {
      bottom: 14px;
      background-image:
        linear-gradient(#5b8def, #5b8def),
        radial-gradient(circle, #070908 1.45px, #3a4440 2.05px, transparent 2.55px);
      background-size: 100% 3px, 14px 22px;
      background-position: 0 16px, 0 0;
      background-repeat: no-repeat, repeat-x;
    }

    #schematic,
    #stage .spinner { position: relative; z-index: 1; }

    .validation {
      border-top: 1px solid var(--line);
      background: #141c19;
      padding: 8px 16px 10px;
      max-height: 168px;
      overflow: auto;
    }
    .validation h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .validation .cards { grid-auto-flow: column; grid-auto-columns: minmax(180px, 240px); grid-template-columns: none; }

    .dock {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
      background: #141c19;
    }
    .tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
    .tabs button { border-bottom: none; border-radius: 6px 6px 0 0; }
    .tabs button.active { color: var(--text); border-color: var(--line); background: #1c2421; }
    .panel { overflow: auto; flex: 1; padding: 8px 12px 12px; }
    .panel[hidden] { display: none; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
    .card {
      background: #1c2421;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      display: grid;
      gap: 4px;
    }
    .card b { font-size: 14px; }
    .card span { color: var(--muted); font-size: 13px; }
    .card.Pass b { color: var(--probe); }
    .card.Fail b { color: var(--fail); }
    .card.Unavailable b, .card.Warning b { color: #79b8ff; }

    .bom { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .bom span { color: var(--muted); }

    #suggestion { margin: 0 16px 8px; }

    @media (max-width: 860px) {
      body { height: auto; overflow: auto; grid-template-rows: auto auto auto auto; }
      .workspace { grid-template-columns: 1fr; }
      #stage { min-height: 360px; }
    }

    #schematic {
      position: relative;
      width: fit-content;
      max-width: none;
      padding: 28px;
    }

    .symbol { cursor: help; }
    .symbol:hover { filter: brightness(1.3); }

    #schematic svg {
      width: auto;
      max-width: none;
      height: auto;
      display: block;
    }

    .trace {
      fill: none;
      stroke-width: 2.25;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .stat {
      min-width: 140px;
    }

    .stat b {
      display: block;
      font-family: Consolas, ui-monospace, monospace;
      font-size: 20px;
      color: var(--probe);
    }

    .stat span, .muted { color: var(--muted); font-size: 13px; }

    .stat.warn b { color: var(--heat); }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      text-align: left;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 500; font-size: 13px; }

    .Pass { color: var(--probe); }
    .Warning { color: var(--heat); }
    .Fail, .error { color: var(--fail); }
    .Unavailable { color: var(--muted); }

    .part {
      border: 1px solid var(--silk);
      color: var(--silk);
      border-radius: 4px;
      padding: 8px 10px;
      min-width: 120px;
    }

    .part b { display: block; color: var(--text); }

    pre {
      overflow: auto;
      color: var(--muted);
      font: 12px/1.4 Consolas, ui-monospace, monospace;
    }

    pre.diagram {
      color: var(--text);
      margin: 0;
      white-space: pre;
      font-size: 13px;
    }

    #log {
      max-height: 180px;
      margin: 0;
      white-space: pre-wrap;
    }

    .chat { display: grid; gap: 6px; }
    .chat p { margin: 0; }
    .chat .user { color: var(--text); }
    .chat .assistant { color: var(--muted); }

    #suggestion {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    #suggestion[hidden] { display: none; }
    #suggestion p { margin: 0; }
    #suggestion .choices { display: flex; gap: 8px; }

    h2 { font-size: 16px; margin: 0; }

    form { display: flex; gap: 8px; }

    textarea,
    input {
      width: 100%;
      flex: 1;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .spinner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 160px;
      color: var(--muted);
    }

    .spinner[hidden] { display: none; }

    .spinner span {
      width: 22px;
      height: 22px;
      border: 2px solid var(--line);
      border-top-color: var(--net);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>ElectronicsAI</h1>
  </header>
  <div class="workspace">
    <aside class="side">
      <form id="describe-form">
        <label for="description">Prompt</label>
        <textarea id="description" placeholder="Create a LED circuit"></textarea>
        <button id="simulate" type="submit" class="primary">Generate</button>
      </form>
      <div class="history-label">History</div>
      <div id="history"></div>
    </aside>
    <section class="viewer">
      <div class="viewer-bar">
        <div>
          <h2 id="title">Generated circuit</h2>
          <p class="muted" id="summary">The schematic appears here.</p>
        </div>
        <div class="tools">
          <button type="button" id="zoom-in">Zoom +</button>
          <button type="button" id="zoom-out">Zoom −</button>
          <button type="button" id="zoom-fit">Fit</button>
          <button type="button" id="export-svg">Export SVG</button>
          <button type="button" id="export-png">Export PNG</button>
        </div>
      </div>
      <div id="stage">
        <div id="spinner" class="spinner" hidden><span></span>Simulating</div>
        <div id="schematic"></div>
      </div>
      <p class="error" id="error" hidden></p>
      <div id="suggestion" hidden>
        <p id="suggestion-text"></p>
        <div class="choices">
          <button type="button" id="suggestion-yes" class="primary">Yes</button>
          <button type="button" id="suggestion-no">No</button>
        </div>
      </div>
    </section>
  </div>
  <section class="validation" aria-label="Validation results">
    <h3>Validation</h3>
    <div id="checks" class="cards"></div>
  </section>
  <div class="dock">
    <div class="tabs" id="tabs">
      <button type="button" data-tab="bom" class="active">BOM</button>
      <button type="button" data-tab="netlist">Netlist</button>
      <button type="button" data-tab="simulation">Simulation</button>
      <button type="button" data-tab="logs">Logs</button>
    </div>
    <div class="panel" id="panel-bom">
      <div id="components"></div>
    </div>
    <div class="panel" id="panel-netlist" hidden>
      <pre id="netlist"></pre>
    </div>
    <div class="panel" id="panel-simulation" hidden>
      <div class="stats" id="stats"></div>
      <ul id="assumptions" class="assumptions" hidden></ul>
    </div>
    <div class="panel" id="panel-logs" hidden>
      <pre id="log"></pre>
      <div id="chat" class="chat"></div>
    </div>
  </div>
  <script>
    let pendingSuggestion = null;
    let lastDescription = "";
    let viewScale = 1;
    const history = [];

    document.getElementById("describe-form").onsubmit = event => {
      event.preventDefault();
      const text = document.getElementById("description").value.trim();
      if (pendingSuggestion && /^(yes|y|yeah|yep)$/i.test(text)) {
        sketch(lastDescription, document.getElementById("suggestion-text").textContent);
        return;
      }
      sketch(text);
    };

    document.getElementById("suggestion-yes").onclick = () => {
      if (pendingSuggestion) sketch(lastDescription, document.getElementById("suggestion-text").textContent);
    };

    document.getElementById("suggestion-no").onclick = () => {
      pendingSuggestion = null;
      document.getElementById("suggestion").hidden = true;
    };

    function resetScreen() {
      document.getElementById("log").textContent = "";
      document.getElementById("chat").replaceChildren();
      document.getElementById("title").textContent = "Generating…";
      document.getElementById("summary").textContent = "";
      document.getElementById("schematic").innerHTML = "";
      document.getElementById("stats").innerHTML = "";
      document.getElementById("assumptions").replaceChildren();
      document.getElementById("assumptions").hidden = true;
      document.getElementById("checks").innerHTML = "";
      document.getElementById("components").innerHTML = "";
      document.getElementById("netlist").textContent = "";
      document.getElementById("error").hidden = true;
      pendingSuggestion = null;
      document.getElementById("suggestion").hidden = true;
    }

    function setBusy(busy) {
      document.getElementById("spinner").hidden = !busy;
      document.getElementById("simulate").disabled = busy;
    }

    function validationPassed(simulation) {
      const checks = simulation && simulation.checks;
      return Array.isArray(checks) && checks.length > 0 && checks.every(check => check.result === "Pass");
    }

    async function requestSketch(prompt) {
      const response = await fetch("/circuits/sketch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ description: prompt })
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      const result = {};
      while (true) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        const events = buffer.split("\n\n");
        buffer = events.pop();
        for (const item of events) {
          const data = item.replace(/^data:\s*/m, "").trim();
          if (!data) continue;
          let payload;
          try {
            payload = JSON.parse(data);
          } catch (parseError) {
            log(`Could not read an event: ${parseError.message}`);
            continue;
          }
          if (payload.log) log(payload.log);
          if (payload.error) result.error = payload.error;
          if (payload.sketch) {
            result.sketch = payload.sketch;
            result.simulation = payload.simulation;
            result.suggestion = payload.suggestion;
          }
        }
      }
      if (!result.sketch && !result.error) result.error = "The simulation could not be finished.";
      return result;
    }

    async function sketch(description, revision) {
      const text = (revision ? lastDescription : description).trim();
      if (!text) return;
      if (!revision) lastDescription = text;
      const error = document.getElementById("error");
      resetScreen();
      setBusy(true);
      document.getElementById("title").textContent = "Generating…";
      remember("user", revision ? "Yes" : text);
      log("Sending the request");
      let nextRevision = revision || "";
      let last = null;
      try {
        for (let attempt = 1; attempt <= 4; attempt += 1) {
          if (attempt > 1) {
            document.getElementById("title").textContent = "Validation failed. Correcting the circuit…";
            document.getElementById("schematic").innerHTML = "";
            log("Asking for a corrected circuit");
          }
          const prompt = nextRevision ? `${text}\n\nCorrect the previous circuit. ${nextRevision}` : text;
          const payload = await requestSketch(prompt);
          if (payload.error) {
            error.hidden = false;
            error.textContent = payload.error;
            document.getElementById("title").textContent = "Simulation not finished";
            return;
          }
          last = payload;
          if (validationPassed(payload.simulation)) {
            renderSketch(payload.sketch, payload.simulation, null);
            remember("assistant", payload.sketch.summary);
            rememberHistory(text, payload.sketch, payload.simulation, null);
            log("Validation passed");
            return;
          }
          const problem = payload.suggestion && payload.suggestion.text;
          log(problem || "Validation did not pass");
          if (!problem) break;
          nextRevision = problem;
        }
        document.getElementById("schematic").innerHTML = "";
        document.getElementById("title").textContent = "Validation did not pass";
        error.hidden = false;
        error.textContent = (last && last.suggestion && last.suggestion.text) || "Validation did not pass.";
        if (last && last.simulation) showChecks(last.simulation);
      } catch (requestError) {
        error.hidden = false;
        error.textContent = requestError.message;
        document.getElementById("title").textContent = "Simulation not finished";
      } finally {
        setBusy(false);
      }
    }

    function showChecks(simulation) {
      const checks = simulation && simulation.checks && simulation.checks.length
        ? simulation.checks.slice()
        : [{ name: "Operating point", detail: "This schematic has no ngspice model yet.", result: "Unavailable" }];
      if (simulation && simulation.inputVolts != null) {
        checks.push({ name: "Supply voltage", detail: `${Number(simulation.inputVolts).toFixed(1)} V`, result: "Pass" });
      }
      document.getElementById("checks").innerHTML = checks.map(check => {
        const mark = check.result === "Pass" ? "✓" : check.result === "Fail" ? "✗" : "•";
        return `<article class="card ${esc(check.result)}"><b>${mark} ${esc(check.name)}</b><span>${esc(check.detail)}</span></article>`;
      }).join("");
    }

    function log(line) {
      const panel = document.getElementById("log");
      const time = new Date().toLocaleTimeString();
      panel.textContent += `${time}  ${line}\n`;
      panel.scrollTop = panel.scrollHeight;
    }

    function renderSketch(sketch, simulation, suggestion) {
      document.getElementById("title").textContent = sketch.title || "Generated circuit";
      document.getElementById("summary").textContent = shownSummary(sketch.summary, simulation && simulation.outputVolts);
      document.getElementById("schematic").innerHTML = drawSketch(sketch, simulation && simulation.outputVolts);
      const netlist = simulation && simulation.netlist ? simulation.netlist : "This circuit has no SPICE netlist.";
      document.getElementById("netlist").textContent = netlist;
      showChecks(simulation);
      const parts = sketch.parts || [];
      document.getElementById("components").innerHTML = parts.length
        ? parts.map(part => {
            const value = symbolValue(part, simulation && simulation.outputVolts) || part.type || "";
            return `<div class="bom"><b>${esc(part.name || part.id)}</b><span>${esc(value)}</span></div>`;
          }).join("")
        : "<p class=\"muted\">No components.</p>";
      const assumptions = simulation && simulation.assumptions ? simulation.assumptions : [];
      const assumptionList = document.getElementById("assumptions");
      assumptionList.hidden = assumptions.length === 0;
      assumptionList.innerHTML = assumptions.map(line => `<li>${esc(line)}</li>`).join("");
      const offer = document.getElementById("suggestion");
      if (suggestion && suggestion.text) {
        pendingSuggestion = suggestion.text;
        document.getElementById("suggestion-text").textContent = suggestion.text;
        offer.hidden = false;
      } else {
        pendingSuggestion = null;
        offer.hidden = true;
      }
      const stats = [];
      const led = (sketch.parts || []).some(part => /led/i.test(`${part.type} ${part.name}`));
      if (simulation && simulation.inputVolts != null) stats.push(["Supply voltage", `${Number(simulation.inputVolts).toFixed(1)} V`]);
      if (simulation && simulation.loadCurrentAmps != null) stats.push([led ? "LED current" : "Current", `${(simulation.loadCurrentAmps * 1000).toFixed(1)} mA`]);
      const power = (simulation && simulation.checks || []).find(check => check.name === "Resistor power" && /^[0-9.]+\sW/.test(check.detail || ""));
      if (power) stats.push(["Resistor power", power.detail.split(" in ")[0]]);
      if (simulation && simulation.outputVolts != null) stats.push(["Output", `${Number(simulation.outputVolts).toFixed(2)} V`]);
      document.getElementById("stats").innerHTML = stats.map(([name, value]) =>
        `<div class="stat"><b>${esc(value)}</b><span>${esc(name)}</span></div>`
      ).join("");
      requestAnimationFrame(fitSchematic);
    }

    function rememberHistory(description, sketch, simulation, suggestion) {
      history.unshift({ description, title: sketch.title || description, sketch, simulation, suggestion });
      if (history.length > 12) history.pop();
      const list = document.getElementById("history");
      list.innerHTML = history.map((item, index) =>
        `<button type="button" class="history-item${index === 0 ? " active" : ""}" data-index="${index}">✓ ${esc(item.title)}</button>`
      ).join("");
    }

    document.getElementById("history").onclick = event => {
      const button = event.target.closest("button");
      if (!button) return;
      const item = history[Number(button.dataset.index)];
      if (!item) return;
      lastDescription = item.description;
      document.getElementById("description").value = item.description;
      renderSketch(item.sketch, item.simulation, item.suggestion);
      document.querySelectorAll(".history-item").forEach(entry => entry.classList.toggle("active", entry === button));
    };

    document.getElementById("tabs").onclick = event => {
      const button = event.target.closest("button");
      if (!button) return;
      document.querySelectorAll("#tabs button").forEach(item => item.classList.toggle("active", item === button));
      document.querySelectorAll(".dock .panel").forEach(panel => {
        panel.hidden = panel.id !== `panel-${button.dataset.tab}`;
      });
    };

    document.getElementById("zoom-in").onclick = () => { viewScale = Math.min(viewScale * 1.2, 4); applyZoom(); };
    document.getElementById("zoom-out").onclick = () => { viewScale = Math.max(viewScale / 1.2, 0.3); applyZoom(); };
    document.getElementById("zoom-fit").onclick = () => fitSchematic();
    document.getElementById("export-svg").onclick = () => downloadSchematic("svg");
    document.getElementById("export-png").onclick = () => downloadSchematic("png");

    function applyZoom() {
      const svg = document.querySelector("#schematic svg");
      if (!svg) return;
      const baseW = Number(svg.getAttribute("width")) || svg.viewBox.baseVal.width;
      const baseH = Number(svg.getAttribute("height")) || svg.viewBox.baseVal.height;
      svg.style.width = `${baseW * viewScale}px`;
      svg.style.height = `${baseH * viewScale}px`;
    }

    function fitSchematic() {
      const stage = document.getElementById("stage");
      const svg = document.querySelector("#schematic svg");
      if (!svg || !stage) return;
      const baseW = Number(svg.getAttribute("width")) || svg.viewBox.baseVal.width;
      const baseH = Number(svg.getAttribute("height")) || svg.viewBox.baseVal.height;
      const fit = Math.min((stage.clientWidth - 48) / baseW, (stage.clientHeight - 48) / baseH);
      viewScale = Math.max(0.35, Math.min(fit || 1, 3));
      applyZoom();
    }

    function schematicMarkup() {
      const svg = document.querySelector("#schematic svg");
      if (!svg) return "";
      const clone = svg.cloneNode(true);
      clone.style.width = "";
      clone.style.height = "";
      const css = getComputedStyle(document.documentElement);
      return new XMLSerializer().serializeToString(clone).replace(/var\((--[\w-]+)\)/g, (_, name) => css.getPropertyValue(name).trim() || "#ccc");
    }

    function downloadSchematic(kind) {
      const markup = schematicMarkup();
      if (!markup) return;
      if (kind === "svg") {
        saveBlob(new Blob([markup], { type: "image/svg+xml" }), "circuit.svg");
        return;
      }
      const image = new Image();
      const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml" }));
      image.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = image.width * 2;
        canvas.height = image.height * 2;
        const context = canvas.getContext("2d");
        context.fillStyle = "#0e1613";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => { if (blob) saveBlob(blob, "circuit.png"); });
        URL.revokeObjectURL(url);
      };
      image.src = url;
    }

    function saveBlob(blob, name) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function remember(role, text) {
      const line = document.createElement("p");
      line.className = role;
      line.textContent = text;
      document.getElementById("chat").appendChild(line);
    }

    function shownSummary(summary, volts) {
      if (volts == null || volts === undefined || !summary) return summary || "";
      const shown = Number(volts).toFixed(2);
      return summary.replace(/(midpoint|output|vout)([\s\S]{0,40}?)~?\d+(?:\.\d+)?\s*V/i, (_, word, gap) => `${word}${gap}${shown} V`);
    }

    function partDetail(part, volts) {
      const kind = `${part.type || ""} ${part.name || ""}`.toLowerCase();
      if (volts != null && volts !== undefined && /vout|\bnode\b|junction/.test(kind)) {
        return `${Number(volts).toFixed(2)} V`;
      }
      if (/gnd|ground/.test(kind)) return "ground";
      const detail = part.note || part.type || "";
      const category = part.category && part.category !== "unknown" ? part.category : "";
      return category && detail ? `${category} · ${detail}` : category || detail;
    }

    function drawSketch(sketch, volts) {
      const parts = sketch.parts || [];
      if (parts.length === 0 && sketch.diagram) {
        return `<pre class="diagram">${esc(sketch.diagram)}</pre>`;
      }
      return drawBlocks(sketch, volts);
    }

    function drawBlocks(sketch, volts) {
      const shown = sketch.parts || [];
      if (shown.length === 0) return "";
      const places = layout(sketch);
      const labels = {};
      shown.forEach(part => {
        const place = places[part.id.toLowerCase()];
        if (place && place.label) labels[part.id.toLowerCase()] = place.label;
      });
      const visible = shown.filter(part => !labels[part.id.toLowerCase()]);
      const pitchX = 150;
      const pitchY = 104;
      const centers = visible.map(part => {
        const place = places[part.id.toLowerCase()] || { column: 0, row: 0 };
        return { part, cx: 88 + place.column * pitchX, cy: 72 + place.row * pitchY };
      });
      const boxes = centers.map(item => {
        const upright = seriesVertical(item, centers, sketch.wires || []);
        const block = isBlock(item.part);
        const span = block ? 112 : twoLead(item.part) ? 52 : 64;
        const across = block ? 58 : twoLead(item.part) ? 28 : 56;
        const w = upright ? across : span;
        const h = upright ? span : across;
        return {
          part: item.part,
          cx: item.cx,
          cy: item.cy,
          upright,
          x: item.cx - w / 2,
          y: item.cy - h / 2,
          w,
          h,
        };
      });

      spread(boxes);

      const marks = [];
      const wires = [];
      const anchors = {};
      const ink = [];
      const pinMarks = [];
      boxes.forEach(box => {
        const laid = arrangePins(box, partPins(box.part, sketch.wires || []));
        Object.assign(anchors, laid.anchors);
        pinMarks.push(laid.marks);
        ink.push(...laid.ink);
      });
      const roles = wireRoles(sketch);
      (sketch.wires || []).forEach((link, index) => {
        const from = pinEnd(link.from, link.to, boxes, anchors, labels);
        const to = pinEnd(link.to, link.from, boxes, anchors, labels);
        if (!from || !to) return;
        const start = placed(from, to);
        const end = placed(to, from);
        const role = roles.get(index) || "signal";
        wires.push(trace(elbowPath(start, end), role));
        if (start.external) wires.push(netLabel(start, role));
        if (end.external) wires.push(netLabel(end, role));
      });

      boxes.forEach(box => {
        const icon = deviceIcon(box.part, box.cx, box.cy);
        const drawn = box.upright ? `<g transform="rotate(90 ${box.cx} ${box.cy})">${icon}</g>` : icon;
        const value = symbolValue(box.part, volts);
        const name = box.part.name || box.part.id;
        marks.push(`<g class="symbol"><title>${esc(hoverText(box.part))}</title>`);
        marks.push(`<rect x="${box.x - 6}" y="${box.y - 6}" width="${box.w + 12}" height="${box.h + 12}" fill="transparent" />`);
        marks.push(drawn);
        if (!isBlock(box.part)) {
          if (box.upright) {
            const aside = value || shortNote(box.part, name);
            marks.push(caption(box.x + box.w + 8, box.cy - (aside ? 2 : -4), name, "text", "start"));
            if (aside) marks.push(caption(box.x + box.w + 8, box.cy + 14, aside, "silk", "start"));
          } else {
            marks.push(caption(box.cx, box.y - 8, name, "text", "middle"));
            if (value) marks.push(caption(box.cx, box.y + box.h + 16, value, "silk", "middle"));
          }
        }
        marks.push("</g>");
      });

      const right = Math.max(...boxes.map(box => box.x + box.w + (boxes.some(item => item.upright) ? 112 : 36)), ...ink.map(point => point.x), 160);
      const bottom = Math.max(...boxes.map(box => box.y + box.h + 56), ...ink.map(point => point.y), 140);
      const left = Math.min(0, ...ink.map(point => point.x));
      const top = Math.min(0, ...ink.map(point => point.y));
      const width = right - left + 8;
      const height = bottom - top + 8;
      return `<svg width="${width}" height="${height}" viewBox="${left - 4} ${top - 4} ${width} ${height}" role="img" aria-label="Schematic">${wires.join("")}${marks.join("")}${pinMarks.join("")}</svg>`;
    }

    function isSwitch(part) {
      const type = `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      if (/regulator|buck|lm2596|lm2576/.test(type)) return false;
      return /button|momentary|spst|spdt|normally[- ]open|(^|[^a-z])switch([^a-z]|$)/.test(type);
    }

    function spread(boxes) {
      for (let pass = 0; pass < 8; pass += 1) {
        let moved = false;
        for (let i = 0; i < boxes.length; i += 1) {
          for (let j = i + 1; j < boxes.length; j += 1) {
            const a = boxes[i];
            const b = boxes[j];
            const overlapX = (a.w / 2 + b.w / 2 + 48) - Math.abs(b.cx - a.cx);
            const overlapY = (a.h / 2 + b.h / 2 + 36) - Math.abs(b.cy - a.cy);
            if (overlapX <= 0 || overlapY <= 0) continue;
            if (overlapX < overlapY) b.cx += Math.sign(b.cx - a.cx || 1) * overlapX;
            else b.cy += Math.sign(b.cy - a.cy || 1) * overlapY;
            b.x = b.cx - b.w / 2;
            b.y = b.cy - b.h / 2;
            moved = true;
          }
        }
        if (!moved) break;
      }
    }

    function isBlock(part) {
      const type = `${part.type || ""} ${part.name || ""}`.toLowerCase();
      return /ecu|temperature|thermistor|tmp36|lm35|(^|[^a-z])ntc([^a-z]|$)/.test(type);
    }

    function blockLabel(part) {
      const type = `${part.type || ""} ${part.name || ""}`.toLowerCase();
      if (type.includes("tmp36")) return "TMP36";
      if (type.includes("lm35")) return "LM35";
      if (type.includes("ecu")) return "ECU";
      const name = (part.name || "").trim();
      if (name && name.length <= 10 && !name.includes("_")) return name;
      if (/temperature|thermistor|ntc/.test(type)) return "Temp";
      return (name || part.id || "Block").slice(0, 10);
    }

    function twoLead(part) {
      const type = `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      if (/mosfet|transistor|npn|pnp|bjt|mcu|esp|ecu|sensor|adder|flip|relay|motor|pump/.test(type)) return false;
      return /resistor|ohm|cap|inductor|coil|diode|schottky|led|solenoid|fuse/.test(type) || isSwitch(part);
    }

    function seriesVertical(item, centers, wires) {
      if (!twoLead(item.part)) return false;
      let upright = 0;
      let across = 0;
      wires.forEach(wire => {
        const ends = [String(wire.from || ""), String(wire.to || "")];
        const mine = ends.find(end => end.split(".")[0].toLowerCase() === item.part.id.toLowerCase());
        if (!mine) return;
        const otherToken = ends.find(end => end !== mine) || "";
        const other = centers.find(center => center.part.id.toLowerCase() === otherToken.split(".")[0].toLowerCase());
        if (!other) {
          upright += 1;
          return;
        }
        const dx = Math.abs(other.cx - item.cx);
        const dy = Math.abs(other.cy - item.cy);
        if (dy >= dx) upright += 1;
        else across += 1;
      });
      return upright >= across;
    }

    function shortNote(part, name) {
      let note = String(part.note || "").trim();
      if (/push\s*button|momentary|spst|normally[- ]open/i.test(note)) note = "Push Button";
      else if (/^led\b/i.test(note)) note = "LED";
      if (!note || note.length > 22 || note.toLowerCase() === String(name || "").toLowerCase()) return "";
      return note;
    }

    function symbolValue(part, volts) {
      const kind = `${part.type || ""} ${part.name || ""}`.toLowerCase();
      if (volts != null && volts !== undefined && /vout|\bnode\b|junction/.test(kind)) {
        return `${Number(volts).toFixed(2)} V`;
      }
      const note = String(part.note || "");
      const ohm = note.match(/(\d+(?:\.\d+)?)\s*(k|m)?\s*(?:ohms?|Ω)/i);
      if (ohm) return `${ohm[1]}${(ohm[2] || "").toLowerCase()}Ω`;
      const unit = note.match(/(\d+(?:\.\d+)?)\s*[µμunpm]?[fh]\b/i);
      if (unit && /cap|inductor|coil/.test(kind)) return unit[0].replace(/µ/g, "μ");
      return "";
    }

    function hoverText(part) {
      const pins = (part.pins || []).map(pin => `Pin ${pin}`);
      return [part.name || part.id, part.note || "", ...pins].filter(Boolean).join("\n");
    }

    function partPins(part, wires) {
      const seen = [];
      const add = pin => {
        const text = String(pin || "").trim();
        if (!text || seen.some(item => item.toLowerCase() === text.toLowerCase())) return;
        seen.push(text);
      };
      (part.pins || []).forEach(add);
      (wires || []).forEach(wire => {
        [wire.from, wire.to].forEach(end => {
          const text = String(end || "").trim();
          const dot = text.indexOf(".");
          if (dot < 1) return;
          if (text.slice(0, dot).toLowerCase() !== String(part.id || "").toLowerCase()) return;
          add(text.slice(dot + 1));
        });
      });
      if (twoLead(part)) defaultPins(part).forEach(add);
      else if (seen.length === 0) defaultPins(part).forEach(add);
      return seen.slice(0, 8);
    }

    function defaultPins(part) {
      const type = `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      if (/vsource|\bsource\b|\bsupply\b|\bbattery\b/.test(type) && !isSwitch(part)) return [];
      if (/\bground\b|\bgnd\b/.test(type)) return [];
      if (type.includes("led")) return ["Anode", "Cathode"];
      if (type.includes("schottky") || type.includes("diode")) return ["A", "K"];
      if (/mosfet|nmos/.test(type)) return ["Gate", "Drain", "Source"];
      if (/pnp|npn|transistor|bjt/.test(type)) return ["Base", "Collector", "Emitter"];
      if (isSwitch(part) || twoLead(part)) return ["1", "2"];
      if (isBlock(part)) return ["VCC", "GND"];
      return [];
    }

    function symbolFrame(box) {
      const type = `${box.part.type || ""} ${box.part.name || ""} ${box.part.note || ""}`.toLowerCase();
      if (isBlock(box.part)) return { x: box.cx - 56, y: box.cy - 29, w: 112, h: 58 };
      if (twoLead(box.part)) return { x: box.x, y: box.y, w: box.w, h: box.h };
      if (/mosfet|nmos|npn|pnp|transistor|bjt/.test(type)) return { x: box.cx - 24, y: box.cy - 24, w: 40, h: 48 };
      return { x: box.cx - 20, y: box.cy - 16, w: 40, h: 32 };
    }

    function electricalSide(pin, part) {
      const name = String(pin || "").trim();
      if (/^(vcc|vdd|vin|vm|\+?5v|3v3|3\.3v)$/i.test(name)) return "top";
      if (/^(gnd|vss|agnd)$/i.test(name)) return "bottom";
      const type = `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      if (/mosfet|nmos|npn|pnp|transistor|bjt/.test(type)) {
        if (/^(gate|base|g|b)$/i.test(name)) return "left";
        if (/^(drain|collector|d|c)$/i.test(name)) return "top";
        if (/^(source|emitter|s|e)$/i.test(name)) return "bottom";
      }
      return "";
    }

    function pinPoint(frame, side, index, count) {
      const along = count === 1 ? 0.5 : (index + 1) / (count + 1);
      if (side === "top") return { x: frame.x + frame.w * along, y: frame.y, side };
      if (side === "bottom") return { x: frame.x + frame.w * along, y: frame.y + frame.h, side };
      if (side === "left") return { x: frame.x, y: frame.y + frame.h * along, side };
      return { x: frame.x + frame.w, y: frame.y + frame.h * along, side };
    }

    function arrangePins(box, pins) {
      const frame = symbolFrame(box);
      const buckets = { top: [], bottom: [], left: [], right: [] };
      if (twoLead(box.part) && pins.length >= 2) {
        if (box.upright) {
          buckets.top.push(pins[0]);
          buckets.bottom.push(pins[1]);
        } else {
          buckets.left.push(pins[0]);
          buckets.right.push(pins[1]);
        }
      } else {
        const rest = [];
        pins.forEach(pin => {
          const side = electricalSide(pin, box.part);
          if (side) buckets[side].push(pin);
          else rest.push(pin);
        });
        rest.forEach((pin, index) => buckets[index % 2 === 0 ? "left" : "right"].push(pin));
      }
      const anchors = {};
      const marks = [];
      const ink = [];
      const stub = !twoLead(box.part);
      Object.entries(buckets).forEach(([side, list]) => {
        list.forEach((pin, index) => {
          const point = pinPoint(frame, side, index, list.length);
          anchors[`${box.part.id}.${pin}`.toLowerCase()] = point;
          const drawn = pinLabel(point, pin, side, stub);
          marks.push(drawn.mark);
          ink.push(drawn.start, drawn.end);
        });
      });
      return { anchors, marks: marks.join(""), ink };
    }

    function pinLabel(point, text, side, stub) {
      const tick = stub ? 8 : 0;
      let mark = "";
      let x = point.x;
      let y = point.y;
      let anchor = "start";
      if (side === "left" || (stub === false && side === "top") || (stub === false && side === "bottom")) {
        x = point.x - 4;
        y = side === "bottom" ? point.y - 2 : side === "top" ? point.y + 11 : point.y + 3;
        anchor = "end";
        if (stub && side === "left") {
          mark = `<line x1="${point.x - tick}" y1="${point.y}" x2="${point.x}" y2="${point.y}" stroke="var(--silk)" stroke-width="1.25" />`;
          x = point.x - tick - 3;
        }
      } else if (side === "right") {
        x = point.x + (stub ? tick + 3 : 4);
        y = point.y + 3;
        anchor = "start";
        if (stub) mark = `<line x1="${point.x}" y1="${point.y}" x2="${point.x + tick}" y2="${point.y}" stroke="var(--silk)" stroke-width="1.25" />`;
      } else if (side === "top") {
        x = point.x + 4;
        y = point.y - tick - 2;
        anchor = "start";
        if (stub) mark = `<line x1="${point.x}" y1="${point.y - tick}" x2="${point.x}" y2="${point.y}" stroke="var(--silk)" stroke-width="1.25" />`;
      } else {
        x = point.x + 4;
        y = point.y + tick + 11;
        anchor = "start";
        if (stub) mark = `<line x1="${point.x}" y1="${point.y}" x2="${point.x}" y2="${point.y + tick}" stroke="var(--silk)" stroke-width="1.25" />`;
      }
      const width = String(text).length * 6.2;
      const startX = anchor === "end" ? x - width : anchor === "middle" ? x - width / 2 : x;
      return {
        mark: `${mark}<text x="${x}" y="${y}" fill="var(--muted)" font-size="10" text-anchor="${anchor}">${esc(text)}</text>`,
        start: { x: startX, y: y - 10 },
        end: { x: startX + width, y: y + 2 },
      };
    }

    function wireRoles(sketch) {
      const wires = (sketch.wires || []).map(wire => ({
        from: String(wire.from || "").trim(),
        to: String(wire.to || "").trim(),
      }));
      (sketch.parts || []).forEach(part => {
        if (!twoLead(part)) return;
        const id = part.id.toLowerCase();
        const hits = [];
        wires.forEach((wire, index) => {
          if (wire.from.split(".")[0].toLowerCase() === id || wire.to.split(".")[0].toLowerCase() === id) hits.push(index);
        });
        if (hits.length !== 2) return;
        const pins = new Set(hits.map(index => {
          const wire = wires[index];
          return (wire.from.split(".")[0].toLowerCase() === id ? wire.from : wire.to).toLowerCase();
        }));
        if (pins.size >= 2) return;
        hits.forEach((index, slot) => {
          const lead = `${part.id}.${slot === 0 ? "1" : "2"}`;
          const wire = wires[index];
          wires[index] = {
            from: wire.from.toLowerCase() === id ? lead : wire.from,
            to: wire.to.toLowerCase() === id ? lead : wire.to,
          };
        });
      });
      const parent = new Map();
      const find = key => {
        const name = String(key || "").trim().toLowerCase();
        if (!name) return "";
        if (!parent.has(name)) parent.set(name, name);
        let root = name;
        while (parent.get(root) !== root) root = parent.get(root);
        parent.set(name, root);
        return root;
      };
      wires.forEach(wire => {
        const left = find(wire.from);
        const right = find(wire.to);
        if (left && right && left !== right) parent.set(left, right);
      });
      const groups = new Map();
      for (const key of parent.keys()) {
        const root = find(key);
        if (!groups.has(root)) groups.set(root, []);
        groups.get(root).push(key);
      }
      const roleOf = new Map();
      for (const keys of groups.values()) {
        const found = keys.map(key => endpointRole(key, sketch.parts || []));
        const role = found.includes("ground") ? "ground" : found.includes("power") ? "power" : found.includes("control") ? "control" : "signal";
        keys.forEach(key => roleOf.set(key, role));
      }
      const roles = new Map();
      wires.forEach((wire, index) => roles.set(index, roleOf.get(find(wire.from)) || "signal"));
      return roles;
    }

    function endpointRole(token, parts) {
      const text = String(token || "").trim();
      const id = text.split(".")[0];
      const pin = text.includes(".") ? text.slice(id.length + 1) : "";
      const part = parts.find(item => item.id.toLowerCase() === id.toLowerCase());
      const kind = part ? `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase() : "";
      if (/^(gnd|vss|agnd|0)$/i.test(text) || /ground|(^|\s)gnd(\s|$)/.test(kind)) return "ground";
      if (/^(vcc|vdd|vin|\+?\d+(?:\.\d+)?v)$/i.test(text) || /vsource|supply|battery/.test(kind)) return "power";
      if (/^(g|gate|b|base)$/i.test(pin) || /gpio|pwm|gate|base/i.test(pin)) return "control";
      return "";
    }

    function layoutColumns(sketch) {
      const parts = sketch.parts || [];
      const wires = sketch.wires || [];
      const byId = {};
      parts.forEach(part => { byId[part.id.toLowerCase()] = part; });
      const kindOf = part => `${part.type || ""} ${part.name || ""}`.toLowerCase();
      const isGroundPart = part => /ground|gnd/.test(kindOf(part));
      const isSupplyPart = part => /vsource|source|supply|battery/.test(kindOf(part));
      const isCapacitor = part => /cap/.test(kindOf(part));
      const isResistor = part => /resistor|ohm/.test(kindOf(part));
      const partId = end => {
        const text = String(end || "").trim();
        const token = text.split(".")[0].toLowerCase();
        return byId[token] ? byId[token].id.toLowerCase() : "";
      };
      const groundEnd = end => /^(gnd|vss|agnd|0)$/i.test(String(end || "").trim()) || isGroundPart(byId[partId(end)] || { type: "" });
      const supplyEnd = end => /^(vcc|vdd|vin)$/i.test(String(end || "").trim()) || isSupplyPart(byId[partId(end)] || { type: "" });
      const neighbors = {};
      parts.forEach(part => { neighbors[part.id.toLowerCase()] = new Set(); });
      wires.forEach(wire => {
        const left = partId(wire.from);
        const right = partId(wire.to);
        if (left && right && left !== right) {
          neighbors[left].add(right);
          neighbors[right].add(left);
        }
      });
      const touchesGround = id => wires.some(wire => {
        const ends = [wire.from, wire.to];
        return ends.some(end => partId(end) === id) && ends.some(groundEnd);
      });
      const shunt = new Set();
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        if (!touchesGround(id)) return;
        const others = [...neighbors[id]].filter(next => !isGroundPart(byId[next]));
        if (isCapacitor(part)) {
          shunt.add(id);
          return;
        }
        if (!isResistor(part) || others.length !== 1) return;
        const upstream = others[0];
        const continues = [...neighbors[upstream]].some(next => next !== id && !isGroundPart(byId[next]));
        if (continues) shunt.add(id);
      });
      const column = {};
      const queue = [];
      parts.forEach(part => {
        if (!isSupplyPart(part)) return;
        column[part.id.toLowerCase()] = 0;
        queue.push(part.id.toLowerCase());
      });
      wires.forEach(wire => {
        const ends = [wire.from, wire.to];
        ends.forEach((end, index) => {
          if (!supplyEnd(end)) return;
          const other = partId(ends[1 - index]);
          if (other && column[other] == null && !shunt.has(other)) {
            column[other] = 1;
            queue.push(other);
          }
        });
      });
      while (queue.length) {
        const id = queue.shift();
        neighbors[id].forEach(next => {
          if (shunt.has(next) || isGroundPart(byId[next]) || column[next] != null) return;
          column[next] = column[id] + 1;
          queue.push(next);
        });
      }
      let spare = Math.max(-1, ...Object.values(column)) + 1;
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        if (column[id] == null && !shunt.has(id) && !isGroundPart(part)) column[id] = spare++;
      });
      shunt.forEach(id => {
        const host = [...neighbors[id]].find(next => column[next] != null && !isGroundPart(byId[next]));
        column[id] = host == null ? spare : column[host];
      });
      const row = {};
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        row[id] = shunt.has(id) ? 1 : 0;
      });
      parts.filter(isGroundPart).forEach(part => {
        const id = part.id.toLowerCase();
        const host = [...neighbors[id]].find(next => shunt.has(next)) || [...neighbors[id]].find(next => column[next] != null);
        column[id] = host == null ? 0 : column[host];
        row[id] = host != null && shunt.has(host) ? 2 : 1;
      });
      return Object.fromEntries(parts.map(part => [part.id.toLowerCase(), { column: column[part.id.toLowerCase()] || 0, row: row[part.id.toLowerCase()] || 0 }]));
    }

    function layout(sketch) {
      return layoutSeries(sketch) || layoutNets(sketch) || layoutColumns(sketch);
    }

    function layoutSeries(sketch) {
      const parts = sketch.parts || [];
      const wires = sketch.wires || [];
      const textOf = part => `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      const supplyPart = part => /vsource|\bsource\b|\bsupply\b|\bbattery\b/.test(textOf(part)) && !isSwitch(part);
      const groundPart = part => /\bground\b|\bgnd\b/.test(textOf(part));
      const chain = parts.filter(part => twoLead(part) && !supplyPart(part) && !groundPart(part));
      if (chain.length < 2 || chain.length > 6) return null;
      if (parts.some(part => !chain.includes(part) && !supplyPart(part) && !groundPart(part))) return null;
      const idOf = end => String(end || "").trim().split(".")[0].toLowerCase();
      const byId = {};
      parts.forEach(part => { byId[part.id.toLowerCase()] = part; });
      const neighbors = {};
      chain.forEach(part => { neighbors[part.id.toLowerCase()] = []; });
      wires.forEach(wire => {
        const left = idOf(wire.from);
        const right = idOf(wire.to);
        const leftChain = Boolean(neighbors[left]);
        const rightChain = Boolean(neighbors[right]);
        if (leftChain && rightChain && left !== right) {
          neighbors[left].push(right);
          neighbors[right].push(left);
        } else if (leftChain) neighbors[left].push(String(wire.to || "").trim());
        else if (rightChain) neighbors[right].push(String(wire.from || "").trim());
      });
      const isSupplyEnd = token => /^(\+?\d+(?:\.\d+)?v|vcc|vdd|vin)$/i.test(token) || (byId[idOf(token)] && supplyPart(byId[idOf(token)]));
      const isGroundEnd = token => /^(gnd|vss|agnd|0)$/i.test(token) || (byId[idOf(token)] && groundPart(byId[idOf(token)]));
      const start = chain.find(part => neighbors[part.id.toLowerCase()].some(isSupplyEnd));
      if (!start) return null;
      const order = [];
      const seen = new Set();
      let current = start.id.toLowerCase();
      while (current && neighbors[current] && !seen.has(current)) {
        seen.add(current);
        order.push(current);
        current = neighbors[current].find(item => neighbors[item] && !seen.has(item)) || "";
      }
      if (order.length !== chain.length || !neighbors[order[order.length - 1]].some(isGroundEnd)) return null;
      const places = Object.fromEntries(order.map((id, row) => [id, { column: 0, row }]));
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        if (places[id]) return;
        if (supplyPart(part)) places[id] = { label: voltageLabel(part) };
        else if (groundPart(part)) places[id] = { label: "GND" };
      });
      return places;
    }

    function voltageLabel(part) {
      const found = `${part.name || ""} ${part.note || ""}`.match(/(\+)?(\d+(?:\.\d+)?)\s*v/i);
      return found ? `${found[1] || "+"}${found[2]}V` : "+5V";
    }

    function layoutNets(sketch) {
      const parts = sketch.parts || [];
      const wires = sketch.wires || [];
      if (parts.length === 0 || wires.length === 0) return null;
      const byId = {};
      parts.forEach(part => { byId[part.id.toLowerCase()] = part; });
      const kind = part => `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      const isGroundPart = part => /\bground\b|\bgnd\b/.test(kind(part));
      const isSupplyPart = part => /vsource|\bsource\b|\bsupply\b|\bbattery\b/.test(kind(part));
      const isResistor = part => /resistor|\bohm\b|ω/.test(kind(part));
      const isCapacitor = part => /\bcap/.test(kind(part));
      const isController = part => /mcu|esp32|esp8266|arduino/.test(kind(part));
      const crowded = part => /sensor|oled|adder|flip|driver|tb6612|l298|l293/.test(kind(part));
      const key = end => String(end || "").trim().toLowerCase();
      const parent = {};
      const find = id => {
        if (!parent[id]) parent[id] = id;
        if (parent[id] !== id) parent[id] = find(parent[id]);
        return parent[id];
      };
      const unite = (a, b) => {
        const left = find(a);
        const right = find(b);
        if (left !== right) parent[right] = left;
      };
      wires.forEach(wire => unite(key(wire.from), key(wire.to)));
      const members = {};
      wires.forEach(wire => [wire.from, wire.to].forEach(end => {
        const root = find(key(end));
        if (!members[root]) members[root] = [];
        members[root].push(key(end));
      }));
      const pinMatches = (pin, names) => {
        const text = String(pin || "").toLowerCase();
        return names.some(name => name.length <= 2 ? text === name : text.includes(name));
      };
      const ownerOf = end => {
        const token = key(end).split(".")[0];
        return byId[token] ? token : "";
      };
      const terminals = part => {
        const id = part.id.toLowerCase();
        const seen = new Map();
        wires.forEach(wire => [wire.from, wire.to].forEach(end => {
          if (ownerOf(end) !== id) return;
          const text = key(end);
          const pin = text.includes(".") ? text.slice(text.indexOf(".") + 1) : "";
          const net = find(text);
          if (!seen.has(net)) seen.set(net, pin);
        }));
        return [...seen.entries()].map(([net, pin]) => ({ net, pin }));
      };
      const isGroundEnd = end => /^(gnd|vss|agnd|0)$/.test(key(end)) || isGroundPart(byId[ownerOf(end)] || { type: "" });
      const isSupplyEnd = end => /^(vcc|vdd|vin)$/.test(key(end)) || isSupplyPart(byId[ownerOf(end)] || { type: "" });
      const isGroundNet = net => (members[find(net)] || []).some(isGroundEnd);
      const isSupplyNet = net => !isGroundNet(net) && (members[find(net)] || []).some(isSupplyEnd);
      const netHasPin = (net, names) => parts.some(part => terminals(part).some(term => term.net === find(net) && pinMatches(term.pin, names)));
      const channel = (part, terms) => {
        if (terms.length < 2) return null;
        if (terms.length === 2) return [terms[0].net, terms[1].net];
        const findTerm = names => terms.find(term => pinMatches(term.pin, names));
        const pair = (left, right) => {
          const a = findTerm(left);
          const b = findTerm(right);
          return a && b && a.net !== b.net ? [a.net, b.net] : null;
        };
        return pair(["d", "drain"], ["s", "source"])
          || pair(["c", "collector"], ["e", "emitter"])
          || pair(["vin"], ["out", "sw", "switch"])
          || null;
      };
      const weight = part => {
        const text = kind(part);
        if (/motor|inductor|coil|led|relay|lamp|solenoid/.test(text)) return 6;
        if (/mosfet|transistor|npn|pnp|bjt|regulator|lm2596/.test(text)) return 5;
        if (/diode|schottky/.test(text)) return 4;
        if (isResistor(part)) return 2;
        return 1;
      };
      const edges = [];
      parts.forEach(part => {
        const terms = terminals(part);
        if (isController(part) || crowded(part) || terms.length > 3 || isCapacitor(part)) return;
        if (isResistor(part) && terms.some(term => netHasPin(term.net, ["g", "gate", "b", "base"]))) return;
        const nets = channel(part, terms);
        if (!nets || nets[0] === nets[1]) return;
        edges.push({ partId: part.id.toLowerCase(), a: nets[0], b: nets[1], w: weight(part) });
      });
      const from = net => edges.filter(edge => edge.a === net || edge.b === net);
      const other = (edge, net) => edge.a === net ? edge.b : edge.a;
      const search = origin => {
        const best = new Map();
        const walk = (net, dist, seen) => {
          if (seen.has(net) || seen.size > 8) return;
          best.set(net, Math.max(best.get(net) ?? -1, dist));
          seen.add(net);
          from(net).forEach(edge => walk(other(edge, net), dist + 1, seen));
          seen.delete(net);
        };
        walk(origin, 0, new Set());
        return best;
      };
      const supplies = [...new Set(Object.keys(members).map(find))].filter(isSupplyNet);
      let origin = null;
      let rank = null;
      let groundDist = -1;
      supplies.forEach(supply => {
        const reached = search(supply);
        const ground = [...reached.keys()].filter(isGroundNet).reduce((far, net) => Math.max(far, reached.get(net) ?? 0), -1);
        if (ground > groundDist) {
          groundDist = ground;
          origin = supply;
          rank = reached;
        }
      });
      if (!origin || !rank || groundDist < 1) return null;
      const spineNets = [origin];
      const spineParts = [];
      let current = origin;
      const claimed = new Set();
      while (!isGroundNet(current)) {
        const step = from(current)
          .filter(edge => !claimed.has(edge.partId))
          .map(edge => ({ edge, next: other(edge, current) }))
          .filter(item => rank.get(item.next) === (rank.get(current) ?? 0) + 1)
          .sort((left, right) => right.edge.w - left.edge.w)[0];
        if (!step) break;
        claimed.add(step.edge.partId);
        spineParts.push(step.edge.partId);
        current = step.next;
        spineNets.push(current);
      }
      if (spineParts.length === 0) return null;
      const places = {};
      const taken = new Set();
      const spineCol = 4;
      const put = (part, column, row, direction) => {
        const id = part.id.toLowerCase();
        if (places[id]) return;
        let col = column;
        for (let guard = 0; guard < 12 && taken.has(`${col},${row}`); guard += 1) col += direction;
        taken.add(`${col},${row}`);
        places[id] = { column: col, row };
      };
      let row = 0;
      parts.filter(part => isSupplyPart(part) && terminals(part).some(term => term.net === origin)).forEach((part, index) => put(part, spineCol + index, row, 1));
      if (Object.keys(places).length) row += 1;
      for (let index = 0; index < spineNets.length - 1; index += 1) {
        const high = spineNets[index];
        const low = spineNets[index + 1];
        const between = edges
          .filter(edge => (edge.a === high && edge.b === low) || (edge.a === low && edge.b === high))
          .sort((left, right) => right.w - left.w);
        between.forEach(edge => {
          claimed.add(edge.partId);
          put(byId[edge.partId], spineCol, row, 1);
        });
        row += 1;
      }
      if (isGroundNet(current)) {
        parts.filter(part => isGroundPart(part) && terminals(part).some(term => term.net === current)).forEach(part => put(part, spineCol, row, 1));
      }
      if (!parts.some(part => places[part.id.toLowerCase()] && isGroundPart(part))) {
        const bottom = Math.max(row, ...Object.values(places).map(place => place.row));
        parts.filter(isGroundPart).forEach(part => put(part, spineCol, bottom + 1, 1));
      }
      const onSpine = net => spineNets.includes(net);
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        if (places[id] || isController(part)) return;
        const terms = terminals(part);
        if (terms.length !== 2) return;
        const ground = terms.find(term => isGroundNet(term.net));
        const live = terms.find(term => term !== ground && onSpine(term.net));
        if (!ground || !live) return;
        const hosts = parts.filter(host => places[host.id.toLowerCase()] && terminals(host).some(term => term.net === live.net));
        const host = hosts.sort((left, right) => places[right.id.toLowerCase()].row - places[left.id.toLowerCase()].row)[0];
        if (!host) return;
        const spot = places[host.id.toLowerCase()];
        put(part, spot.column + 1, spot.row, 1);
      });
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        if (places[id] || isSupplyPart(part) || isGroundPart(part)) return;
        const terms = terminals(part);
        if (terms.length !== 1 || !onSpine(terms[0].net)) return;
        const hosts = parts.filter(host => places[host.id.toLowerCase()] && terminals(host).some(term => term.net === terms[0].net));
        const host = hosts.sort((left, right) => places[right.id.toLowerCase()].row - places[left.id.toLowerCase()].row)[0];
        if (!host) return;
        const spot = places[host.id.toLowerCase()];
        put(part, spot.column + 1, spot.row, 1);
      });
      const queue = [];
      const seen = new Set();
      const enqueue = anchorId => {
        const anchor = byId[anchorId];
        if (!anchor) return;
        terminals(anchor).forEach(term => {
          if (isGroundNet(term.net)) return;
          parts.forEach(part => {
            const id = part.id.toLowerCase();
            if (places[id] || seen.has(id)) return;
            if (!terminals(part).some(item => item.net === term.net)) return;
            queue.push({ id, anchor: anchorId });
          });
        });
      };
      Object.keys(places).forEach(enqueue);
      while (queue.length) {
        const item = queue.shift();
        if (places[item.id] || seen.has(item.id)) continue;
        seen.add(item.id);
        const anchor = places[item.anchor];
        if (!anchor) continue;
        const part = byId[item.id];
        const terms = terminals(part);
        const shunt = !isController(part) && terms.length === 2 && isResistor(part) && terms.some(term => isGroundNet(term.net));
        put(part, anchor.column - 1, anchor.row + (shunt ? 1 : 0), -1);
        enqueue(item.id);
      }
      let spare = Math.max(...Object.values(places).map(place => place.column), spineCol) + 1;
      parts.forEach(part => {
        const id = part.id.toLowerCase();
        if (!places[id]) put(part, spare++, 0, 1);
      });
      const shift = Math.min(...Object.values(places).map(place => place.column));
      Object.values(places).forEach(place => { place.column -= shift; });
      return places;
    }

    function pinSlot(box, index, count) {
      if (count <= 1) return box.y + box.h / 2;
      const top = box.y + 24;
      const bottom = box.y + box.h - 24;
      return top + index * ((bottom - top) / (count - 1));
    }

    function deviceBody(x, y, w, h) {
      return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--face)" stroke="var(--silk)" stroke-width="1.5" />`;
    }

    function deviceIcon(part, cx, cy) {
      const type = `${part.type || ""} ${part.name || ""} ${part.note || ""}`.toLowerCase();
      if (type.includes("resistor") || type.includes("ohm")) return iconResistor(cx, cy);
      if (type.includes("inductor") || type.includes("coil") || /\d\s*[uµμ]h/.test(type)) return iconInductor(cx, cy);
      if (type.includes("cap")) return iconCapacitor(cx, cy);
      if (type.includes("schottky") || type.includes("diode")) return iconDiode(cx, cy);
      if (type.includes("ground") || type.includes("gnd")) return ground(cx, cy);
      if (/(^|[^a-z])node([^a-z]|$)/.test(type) || type.includes("junction")) return `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--net)" />`;
      if (type.includes("mosfet") || type.includes("nmos")) return iconMosfet(cx, cy);
      if (type.includes("pnp")) return iconTransistor(cx, cy, true);
      if (type.includes("npn") || type.includes("transistor") || type.includes("bjt") || type.includes("2n") || /(^|\s)q\d/.test(type)) return iconTransistor(cx, cy, false);
      if (type.includes("vsource") || type.includes("source") || type.includes("supply") || type.includes("battery")) {
        return `<circle cx="${cx}" cy="${cy}" r="16" fill="none" stroke="var(--silk)" stroke-width="1.5" />
          <text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="var(--silk)" font-size="12">+</text>`;
      }
      if (type.includes("solenoid")) return iconInductor(cx, cy);
      if (type.includes("led")) return iconLed(cx, cy);
      if (type.includes("adder")) return iconAdder(cx, cy);
      if (isBlock(part)) return iconBlock(cx, cy, blockLabel(part));
      if (type.includes("mcu") || type.includes("esp") || type.includes("ecu")) return iconChip(cx, cy);
      if (type.includes("sensor")) return iconSensor(cx, cy);
      if (isSwitch(part)) return iconSwitch(cx, cy);
      if (type.includes("flip")) return iconFlop(cx, cy);
      return iconChip(cx, cy);
    }

    function iconResistor(cx, cy) {
      const x = cx - 26;
      return `<polyline points="${x},${cy} ${x + 8},${cy} ${x + 14},${cy - 8} ${x + 22},${cy + 8} ${x + 30},${cy - 8} ${x + 38},${cy + 8} ${x + 44},${cy} ${x + 52},${cy}" fill="none" stroke="var(--silk)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" />`;
    }

    function iconTransistor(cx, cy, pnp) {

        ? `<polygon points="${bar + 1},${cy + 6} ${cx + 7},${cy + 3} ${cx + 4},${cy + 11}" fill="var(--silk)" />`
        : `<polygon points="${cx + 3},${cy + 9} ${cx + 13},${cy + 15} ${cx + 5},${cy + 17}" fill="var(--silk)" />`;
      return `<line x1="${cx - 24}" y1="${cy}" x2="${bar}" y2="${cy}" stroke="var(--silk)" stroke-width="1.5" />

        <line x1="${bar}" y1="${cy - 6}" x2="${cx + 12}" y2="${cy - 16}" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${cx + 12}" y1="${cy - 16}" x2="${cx + 12}" y2="${cy - 24}" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${bar}" y1="${cy + 6}" x2="${cx + 12}" y2="${cy + 16}" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${cx + 12}" y1="${cy + 16}" x2="${cx + 12}" y2="${cy + 24}" stroke="var(--silk)" stroke-width="1.5" />
        ${arrow}`;

    function iconMosfet(cx, cy) {

    function iconLed(cx, cy) {

        <line x1="${cx + 8}" y1="${cy - 12}" x2="${cx + 8}" y2="${cy + 12}" stroke="var(--silk)" stroke-width="1.5" />

    function iconAdder(cx, cy) {

    function iconInductor(cx, cy) {

    function iconDiode(cx, cy) {
      return `<line x1="${cx - 28}" y1="${cy}" x2="${cx - 12}" y2="${cy}" stroke="var(--silk)" stroke-width="1.5" />

    function iconCapacitor(cx, cy) {
      return `<line x1="${cx - 22}" y1="${cy}" x2="${cx - 4}" y2="${cy}" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${cx - 4}" y1="${cy - 14}" x2="${cx - 4}" y2="${cy + 14}" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${cx + 4}" y1="${cy - 14}" x2="${cx + 4}" y2="${cy + 14}" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${cx + 4}" y1="${cy}" x2="${cx + 22}" y2="${cy}" stroke="var(--silk)" stroke-width="1.5" />`;

    function iconSwitch(cx, cy) {
      return `<line x1="${cx - 26}" y1="${cy}" x2="${cx - 8}" y2="${cy}" stroke="var(--silk)" stroke-width="1.5" />
        <circle cx="${cx - 8}" cy="${cy}" r="2.5" fill="var(--silk)" />
        <line x1="${cx - 8}" y1="${cy}" x2="${cx + 10}" y2="${cy - 14}" stroke="var(--silk)" stroke-width="1.5" />
        <circle cx="${cx + 12}" cy="${cy}" r="2.5" fill="none" stroke="var(--silk)" stroke-width="1.5" />
        <line x1="${cx + 12}" y1="${cy}" x2="${cx + 26}" y2="${cy}" stroke="var(--silk)" stroke-width="1.5" />`;
    }

    function iconBlock(cx, cy, label) {
      const width = 112;
      const height = 58;
      const x = cx - width / 2;
      const y = cy - height / 2;
      return `<rect x="${x}" y="${y}" width="${width}" height="${height}" rx="4" fill="none" stroke="var(--silk)" stroke-width="1.5" />
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" fill="var(--text)" font-size="14">${esc(label)}</text>`;
    }

    function iconChip(cx, cy) {
      const x = cx - 16;
      const y = cy - 14;
      let legs = "";
      for (let index = 0; index < 3; index++) {
        const pinY = y + 6 + index * 8;
        legs += `<line x1="${x - 7}" y1="${pinY}" x2="${x}" y2="${pinY}" stroke="var(--silk)" stroke-width="1.5" />`;
        legs += `<line x1="${x + 32}" y1="${pinY}" x2="${x + 39}" y2="${pinY}" stroke="var(--silk)" stroke-width="1.5" />`;
      }
      return `${legs}<rect x="${x}" y="${y}" width="32" height="28" rx="2" fill="none" stroke="var(--silk)" stroke-width="1.5" />
        <circle cx="${x + 7}" cy="${y + 7}" r="2" fill="var(--probe)" />`;
    }

    function iconSensor(cx, cy) {
      return `<polygon points="${cx},${cy - 16} ${cx + 14},${cy} ${cx},${cy + 16} ${cx - 14},${cy}" fill="none" stroke="var(--silk)" stroke-width="1.5" />
        <circle cx="${cx}" cy="${cy}" r="3" fill="none" stroke="var(--probe)" stroke-width="1.5">
          <animate attributeName="r" values="3;8;3" dur="1.6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite" />
        </circle>`;
    }

    function iconFlop(cx, cy) {
      return `<polygon points="${cx - 18},${cy - 12} ${cx - 6},${cy} ${cx - 18},${cy + 12}" fill="none" stroke="var(--probe)" stroke-width="1.5" />
        <text x="${cx + 2}" y="${cy + 4}" fill="var(--silk)" font-size="13">Q</text>`;
    }

    function pinEnd(token, other, boxes, anchors, labels) {
      const text = String(token || "").trim();
      if (!text) return null;
      const id = text.split(".")[0];
      if (labels && labels[id.toLowerCase()]) return { external: true, label: labels[id.toLowerCase()] };
      const box = boxes.find(item => item.part.id.toLowerCase() === id.toLowerCase());
      const otherText = String(other || "").trim();
      const otherId = otherText.split(".")[0].toLowerCase();
      const otherBox = boxes.find(item => item.part.id.toLowerCase() === otherId);
      if (box && !otherBox && labels && labels[otherId]) {
        const below = /^(gnd|vss|agnd|0)$/i.test(labels[otherId]);
        return { x: box.x + box.w / 2, y: below ? box.y + box.h : box.y, side: below ? "bottom" : "top" };
      }
      const named = anchors && anchors[text.toLowerCase()];
      if (box && named) return named;
      if (!box) return text.includes(".") ? null : { external: true, label: text };
      if (!otherBox && /^(gnd|vss|agnd|0)$/i.test(otherText)) return { x: box.x + box.w / 2, y: box.y + box.h, side: "bottom" };
      if (!otherBox && /^(vcc|vdd|vin|\+?\d+(?:\.\d+)?v)$/i.test(otherText)) return { x: box.x + box.w / 2, y: box.y, side: "top" };
      if (otherBox) {
        const dx = (otherBox.x + otherBox.w / 2) - (box.x + box.w / 2);
        const dy = (otherBox.y + otherBox.h / 2) - (box.y + box.h / 2);
        if (Math.abs(dy) > Math.abs(dx)) {
          const below = dy > 0;
          return { x: box.x + box.w / 2, y: below ? box.y + box.h : box.y, side: below ? "bottom" : "top" };
        }
      }
      const dotted = anchors[text.toLowerCase()];
      if (dotted) return dotted;
      if (!otherBox) return { x: box.x + box.w, y: box.y + box.h / 2, side: "right" };
      const dx = (otherBox.x + otherBox.w / 2) - (box.x + box.w / 2);
      const dy = (otherBox.y + otherBox.h / 2) - (box.y + box.h / 2);
      if (Math.abs(dy) > Math.abs(dx)) {
        const below = dy > 0;
        return { x: box.x + box.w / 2, y: below ? box.y + box.h : box.y, side: below ? "bottom" : "top" };
      }
      const faceLeft = dx < 0;
      return { x: faceLeft ? box.x : box.x + box.w, y: box.y + box.h / 2, side: faceLeft ? "left" : "right" };
    }

    function placed(end, other) {
      if (!end.external) return end;
      if (other.side === "bottom") return { x: other.x, y: other.y + 28, side: "bottom", external: true, label: end.label };
      if (other.side === "top") return { x: other.x, y: other.y - 28, side: "top", external: true, label: end.label };
      const outward = other.side === "left" ? -52 : 52;
      return { x: other.x + outward, y: other.y, side: other.side, external: true, label: end.label };
    }

    function elbowPath(start, end) {
      if (Math.abs(start.y - end.y) < 1) return `M${start.x},${start.y} L${end.x},${end.y}`;
      if (Math.abs(start.x - end.x) < 1) return `M${start.x},${start.y} L${end.x},${end.y}`;
      if (start.side === "top" || start.side === "bottom" || end.side === "top" || end.side === "bottom") {
        const midY = Math.round((start.y + end.y) / 2);
        return `M${start.x},${start.y} L${start.x},${midY} L${end.x},${midY} L${end.x},${end.y}`;
      }
      const mid = Math.round((start.x + end.x) / 2);
      return `M${start.x},${start.y} L${mid},${start.y} L${mid},${end.y} L${end.x},${end.y}`;
    }

    function trace(path, role) {
      const stroke = role === "power" ? "var(--power)" : role === "ground" ? "var(--gnd)" : role === "control" ? "var(--control)" : "var(--signal)";
      return `<path class="trace" stroke="${stroke}" d="${path}" />`;
    }

    function flow(path, duration) {
      const half = Number.parseFloat(duration) / 2;
      return `<g pointer-events="none">
        <circle r="3.5" fill="var(--probe)"><animateMotion dur="${duration}" repeatCount="indefinite" path="${path}" /></circle>
        <circle r="3.5" fill="var(--probe)"><animateMotion dur="${duration}" repeatCount="indefinite" begin="-${half}s" path="${path}" /></circle>
      </g>`;
    }

    function netLabel(end, role) {
      const tone = role === "power" ? "power" : role === "ground" ? "gnd" : role === "control" ? "control" : "signal";
      if (/^(gnd|vss|agnd|0)$/i.test(String(end.label))) {
        const y = end.side === "top" ? end.y - 16 : end.y;
        return ground(end.x, y);
      }
      const above = end.side === "top" || end.side === "bottom";
      const x = above ? end.x : end.side === "left" ? end.x - 6 : end.x + 6;
      const y = above ? end.y + (end.side === "top" ? -4 : 16) : end.y - 6;
      const anchor = above ? "middle" : end.side === "left" ? "end" : "start";
      return caption(x, y, end.label, tone, anchor);
    }

    function ground(x, y) {
      return `<line x1="${x - 14}" y1="${y}" x2="${x + 14}" y2="${y}" stroke="var(--gnd)" stroke-width="1.5" />
        <line x1="${x - 9}" y1="${y + 6}" x2="${x + 9}" y2="${y + 6}" stroke="var(--gnd)" stroke-width="1.5" />
        <line x1="${x - 4}" y1="${y + 12}" x2="${x + 4}" y2="${y + 12}" stroke="var(--gnd)" stroke-width="1.5" />`;
    }

    function caption(x, y, text, tone, anchor = "start", id = "") {
      const fill = tone === "power" ? "var(--power)"
        : tone === "gnd" ? "var(--gnd)"
        : tone === "control" ? "var(--control)"
        : tone === "signal" ? "var(--signal)"
        : tone === "probe" ? "var(--probe)"
        : tone === "silk" ? "var(--silk)"
        : "var(--text)";
      const idAttr = id ? ` id="${id}"` : "";
      return `<text${idAttr} x="${x}" y="${y}" fill="${fill}" font-size="12" text-anchor="${anchor}">${esc(text)}</text>`;
    }

    function esc(value) {
      return String(value).replace(/[&<>"]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[character]));
    }

  </script>
</body>
</html>
